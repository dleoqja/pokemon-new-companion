name = "pokemon-new-companion-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 플랜은 SQLite 기반 Durable Object만 쓸 수 있다 (저장은 안 하지만 형식만 맞춘다)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 계정(아이디·비밀번호, 저장 칸, 랭킹). 'main' 하나만 쓴다
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]
